[package]
name = "juno-driver-apple-tv"
version = "1.0.0"
edition = "2024"
description = "Apple TV over the Companion link, or over IR"
publish = false

[lib]
name = "juno_driver_apple_tv"
crate-type = ["cdylib", "rlib"]

[dependencies]
# The SDK re-exports core's types, so the two are one unit: a driver built against a
# different core than it runs on is refused by the ABI check rather than half-understood.
# Tracks `main`. No tags while the contracts are still moving.
driver-sdk = { git = "https://github.com/junohouse/driver-sdk", branch = "main" }

# Working on core and this driver at once: point the SDK at a local checkout.
#   [patch."https://github.com/junohouse/driver-sdk"]
#   driver-sdk = { path = "../../driver-sdk" }

# Companion is HomeKit's pairing handshake under a different framing, so the crypto is the
# HAP set. It lives here rather than in core because Companion is a *vendor* protocol —
# exactly one manufacturer's boxes speak it — and core's rule is that vendor knowledge is the
# driver's. HAP itself is in core precisely because it is not: an ecobee, a Nanoleaf panel and
# a door lock all speak that one.
#
# The cost is that this dylib carries its own copy rather than sharing core's. Measured at the
# bottom of this file.
sha2 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
hmac = { version = "0.12", default-features = false }
num-bigint = { version = "0.4", default-features = false }
# Used the same way core's `hap.rs` uses it, and for the same reason: the crate's own `M1`
# "doesn't follow the spec but apparently no one does" — its words — and HAP does. So this
# supplies the 3072-bit group and the modular arithmetic, and `u`, `M1` and `M2` are computed
# against PADded values here. See `srp.rs`.
srp = "0.6"
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
x25519-dalek = { version = "2", default-features = false, features = ["static_secrets"] }
rand_core = { version = "0.6", features = ["getrandom"] }

# Its own repo, so its own workspace root. Without this, a checkout sitting inside another
# workspace is claimed by that workspace and refuses to build.
[workspace]

# A driver is a dylib the controller loads, and it is downloaded and kept per project — so it
# is tuned for size rather than for the last few percent of speed. A driver spends its time
# waiting on a device, not in its own code.
#
# `panic = "abort"` is deliberately NOT here. `export_driver!` wraps dispatch in `catch_unwind`
# so a driver that panics reports a warning instead of taking the controller down with it.
[profile.release]
opt-level = "z"
codegen-units = 1
lto = true
strip = true
