# Apple TV over IR — the whole driver.
#
# Each command resolves a code *name* against the `[ir]` table and core hands the emitter the
# pronto payload. `dpad` substitutes its own `key` argument as the name, so one line covers
# every direction rather than eight.
#
# The Apple TV's own Siri Remote is Bluetooth. What answers IR is the older aluminium Apple
# Remote's protocol, which every Apple TV including the 4K still accepts — a modified NEC at
# 38 kHz. It is a six-button remote, so this is a six-button driver: no apps, no titles, no
# text, and no power (the box has no discrete power state to command, which is why `on` and
# `off` are absent rather than faked).

command.play = { control = 1, invoke = "send", args = { code = "playpause" } }
command.pause = { control = 1, invoke = "send", args = { code = "playpause" } }

# Menu, not a stop code — there is no stop on this remote, and Menu is what leaves what is
# playing. The same key is `back`, which is why both names resolve to it below.
command.stop = { control = 1, invoke = "send", args = { code = "menu" } }

# `{key}` is substituted from the command's own argument before the code is looked up, so the
# table below is keyed by the contract's own key names.
command.dpad = { control = 1, invoke = "send", args = { code = "{key}" } }

# Holding a key. The emitter keeps the carrier up rather than re-sending frames, which is what
# scrolling a long list actually needs — tapping `down` forty times is not the same gesture.
#
# `what` resolves against the same table, so only the keys with codes below can be held. An
# Apple Remote has no volume buttons at all — volume on an Apple TV belongs to whatever it is
# plugged into — so `hold {what = "volume_up"}` finds no code, passes its name through, and the
# emitter refuses it. That is the intended outcome rather than a gap: this driver genuinely
# cannot ramp a volume, and the network one says so by declaring the capability differently.
command.hold = { control = 1, invoke = "start_repeat", args = { code = "{what}" } }
command.release = { control = 1, invoke = "stop_repeat" }

[ir]
format = "pronto"

# Captured from the aluminium Apple Remote and published by Just Add Power for control-system
# use; confirmed by AVS Forum as still working on Apple TV 4K, which kept the IR receiver and
# the protocol unchanged.
#
# Two things to notice in the data. Carrier is `006C` — 38 kHz, as the protocol wants. And
# `playpause` and `select` are `0044` burst pairs where the others are `0022`: Apple sends
# those two as a doubled frame, so a "tidied" single-frame version of them does nothing.

# Apple TV has no Home over IR at all: on the remote it is a *hold* of Menu, and a single
# emitted code cannot express a hold. Deliberately absent rather than aliased to Menu — Menu
# goes back one level, which is not the same thing, and quietly doing the wrong thing is worse
# than an emitter refusing a code it does not have. `info` is absent for the same reason.

codes.menu = "0000 006C 0022 0002 015B 00AD 0015 0015 0015 0041 0015 0041 0015 0041 0015 0015 0015 0041 0015 0041 0015 0041 0015 0041 0015 0041 0015 0041 0015 0015 0015 0015 0015 0015 0015 0015 0015 0041 0015 0015 0015 0041 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0041 0015 0015 0015 0015 0015 0041 0015 0015 0015 0041 0015 0041 0015 0015 0015 0617 015B 0057 0015 0E76"

# The same key. On Apple TV, Menu *is* back — there is no separate one.
codes.back = "0000 006C 0022 0002 015B 00AD 0015 0015 0015 0041 0015 0041 0015 0041 0015 0015 0015 0041 0015 0041 0015 0041 0015 0041 0015 0041 0015 0041 0015 0015 0015 0015 0015 0015 0015 0015 0015 0041 0015 0015 0015 0041 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0015 0041 0015 0015 0015 0015 0015 0041 0015 0015 0015 0041 0015 0041 0015 0015 0015 0617 015B 0057 0015 0E76"

